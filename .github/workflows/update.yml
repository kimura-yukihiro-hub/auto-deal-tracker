name: Update site

on:
  schedule:
    # GitHub の定期実行は毎時0分付近が混雑し、遅延・破棄されやすいため分をずらす
    - cron: "43 21 * * *" # 毎日 日本時間 6:43（本番）
    - cron: "13 23 * * *" # 毎日 日本時間 8:13（本番が破棄された場合の予備）
  workflow_dispatch: # 手動実行も可能にする
  push:
    branches: [main]
    paths:
      - "data/featured.json" # ピックアップを編集したらすぐ再生成する
      - "fetch_and_build.py" # 生成処理を変更したらすぐ反映する
      - "notify_indexnow.py"
      - "articles.py"
      - "affiliate.py"
      - "articles/**" # 記事を追加・編集したらすぐ公開する
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch feeds and build
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_SITE_URL: ${{ secrets.RAKUTEN_SITE_URL }}
        run: python fetch_and_build.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update site ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))"
          # 実行中に別のコミット（featured.json の編集など）が入っても push できるよう取り込む
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify search engines (IndexNow)
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true # 通知の失敗でサイト更新を失敗扱いにしない
        timeout-minutes: 12
        run: python notify_indexnow.py
