<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1500px;height:500px;overflow:hidden}
body{font-family:"Yu Gothic UI","Meiryo",sans-serif;background:linear-gradient(120deg,#1e3a8a 0%,#2563eb 55%,#3b82f6 100%);color:#fff;position:relative}
/* X のヘッダーは左下がアイコンで隠れ、スマホでは上下が切れるため、文字は中央〜右寄せに置く */
.box{position:absolute;right:110px;top:50%;transform:translateY(-50%);text-align:right}
.badge{display:inline-flex;gap:12px;margin-bottom:22px}
.badge span{font-size:26px;font-weight:700;padding:6px 18px;border-radius:999px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35)}
.badge span.sale{background:#fff;color:#bf0000;border-color:#fff}
h1{font-size:92px;margin:0 0 14px;letter-spacing:3px;line-height:1}
p{font-size:34px;margin:0;font-weight:600;opacity:.95}
.url{margin-top:18px;font-size:24px;opacity:.8}
</style></head><body><div class="box">
<div class="badge"><span>スマホ</span><span>パソコン</span><span>家電</span><span class="sale">セール速報</span></div>
<h1>セールの見張り番</h1>
<p>セール情報を毎朝まとめてお届け</p>
<div class="url">auto-deal-tracker.pages.dev</div>
</div>
